name: Build ZN-M2 (LibWrt 25.12-nss / Linux 6.12.116 / NSS)

# 目标：兆能 ZN-M2 (zn,m2 / qualcommax-ipq60xx / 128MiB NAND + UBI)
# 源码：LiBwrt/LibWrt 25.12-nss 分支 = Linux 6.12.116 + 满血 NSS 数据面
# NSS 固件：11.4.0.5 Release 6（feed 默认值，与当前在用固件一致，支持 mesh）
# 包管理器：opkg（上游 CONFIG_USE_APK default y，本包显式关闭；防线一校验）
# 产物：*-zn_m2-squashfs-sysupgrade.bin（唯一可刷）+ factory.ubi（救砖备用）
# 与旧 6.18 包的区别：保留 qca-nss-drv / ecm / pppoe 全套卸载。
# 2026-11-14 第二版（用户定制）：
#   - 内置定制页清单全部软件：iStore / ddns-go / acme / cpufreq / samba4 / upnp /
#     tailscale / ttyd / irqbalance / Argon Light 主题 / kmod-tun / USB 存储 / ext4
#   - OpenClash 只装「壳」（LuCI + 脚本），内核与数据库刷后从 U 盘备份恢复
#   - CPU 编译期解锁 1.6/1.8GHz（放宽 OPP speedbin 位图）+ 可选开机定频
#   - 首次开机把 LAN 预置为 192.168.9.1（避开光猫）
#   - 保留 WiFi(ath11k+板级校准) / USB3.0 / 满血 NSS 11.4 / opkg
# 2026-11-15 v9：busybox 第②层 sed 改成完全不含 $ 的写法（run #7 证明
#     define + $(eval) 双重展开会把 '=y$$/' 吃成 '=y'，sed 报 unterminated s）。
#     主 .config 防线 + -Wno-error 兜底 + Build 静态自检 + 完整 make world 均保留。
# 2026-11-14 定稿（用户最终口径）：
#   - 不内置路由狗 NAS 界面（用户明确取消）；只保留 iStore 商店 + Argon 主题
#   - 包管理器确定为 opkg / .ipk：seed 写 "# CONFIG_USE_APK is not set"，
#     防线一禁止 CONFIG_USE_APK=y，BUILD-REPORT 标注 .ipk / Packages.gz
#   - 修复 run #2 失败点：wpad-openssl 被 defconfig 丢弃（条件依赖未选中），
#     补 libopenssl/libopenssl-legacy + wpad 变体兜底 + 批量校验
# 网页版极简部署：本文件仍是唯一需要上传的文件。
# 只手动触发，不做定时编译。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'LiBwrt/LibWrt 分支名（默认 25.12-nss = 6.12.116 + NSS）'
        required: true
        default: '25.12-nss'
      nss_firmware:
        description: 'NSS 固件版本（默认 11.4 = 上游默认及当前在用；12.5 不支持 802.11s mesh）'
        type: choice
        options:
          - '11_4'
          - '12_5'
        default: '11_4'
      with_openclash:
        description: '内置 OpenClash 壳（LuCI+脚本；内核/节点/数据库刷后从备份恢复）'
        type: boolean
        default: true
      with_istore:
        description: '内置 iStore 应用商店（追加 linkease/istore feed）'
        type: boolean
        default: true
      cpu_unlock_18:
        description: '解锁 CPU 1.6/1.8GHz（编译期放宽 OPP speedbin 位图）'
        type: boolean
        default: true
      cpu_lock_perf:
        description: '开机自动定频 1.8GHz + performance（需同时勾选解锁）'
        type: boolean
        default: true
      preset_lan:
        description: '首次开机把 LAN 预置为 192.168.9.1'
        type: boolean
        default: true
      use_cache:
        description: '复用 dl / ccache 缓存'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-znm2-612nss
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SOURCE_REF: ${{ inputs.source_ref }}
      NSS_FW: ${{ inputs.nss_firmware }}
    steps:
      # 单文件版：设备/软件包配置已内嵌在下方 Prepare config 步骤，无需 Config/ 目录。
      # 仍先扩盘再 checkout（扩盘会重新挂载 workspace）。
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          # GitHub 托管 runner 的 Ubuntu apt 镜像偶发 5xx / 解析失败：
          # run #1 与 run #3 都在这一步以 exit 100 中止，而 run #2 用完全
          # 相同的命令却顺利通过 —— 属于云端偶发，与固件配置无关。
          # 给 update / install 各三次重试，并让 apt 对单次下载自身重试 5 次。
          APTOPT="-o Acquire::Retries=5 -o Dpkg::Use-Pty=0"
          for i in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get $APTOPT update; then break; fi
            echo "::warning:: apt-get update 第 $i 次失败，稍后重试"
            if [ "$i" -eq 3 ]; then echo "::error:: apt-get update 三次均失败"; exit 1; fi
            sleep $((i * 10))
          done
          MUST="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses-dev libssl-dev libelf-dev python3-setuptools \
                python3-pip unzip zlib1g-dev zstd libzstd-dev file wget rsync patch \
                vim-common ccache cpio bc"
          for i in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get $APTOPT install -y \
                 --no-install-recommends $MUST; then break; fi
            echo "::warning:: 必需依赖第 $i 次安装失败，稍后重试"
            if [ "$i" -eq 3 ]; then echo "::error:: 必需依赖三次均失败"; exit 1; fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get $APTOPT update || true
            sleep $((i * 10))
          done
          # 这三个包不是 Linux 6.12 / LibWrt 编译必需（ecj 只给 Java 包、
          # libc6-dev-i386 给 32 位工具链、libev-dev 给个别用户态工具）；
          # 源里偶尔缺也不阻断，避免一个包把整次编译卡死。
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APTOPT install -y \
            --no-install-recommends ecj libc6-dev-i386 libev-dev \
            || echo "::warning:: 可选依赖安装失败，继续（不影响本固件编译）"
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"

      - name: Clone source and record version
        run: |
          set -e
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/LiBwrt/LibWrt openwrt
          git -C openwrt rev-parse HEAD | tee "${GITHUB_WORKSPACE}/source-commit.txt"
          echo "--- 内核版本证据 ---"
          grep -E '^KERNEL_PATCHVER' openwrt/target/linux/qualcommax/Makefile || true
          grep -R '^LINUX_VERSION-6.12' openwrt/target/linux/generic/kernel-6.12 || true
          echo "--- zn_m2 设备定义 ---"
          grep -A9 'define Device/zn_m2' openwrt/target/linux/qualcommax/image/ipq60xx.mk || true
          echo "--- NSS 默认包（应含 drv / ecm / pppoe）---"
          grep -E 'kmod-qca-nss-(drv|ecm|drv-pppoe)' openwrt/target/linux/qualcommax/Makefile || true

      - name: Restore cache (dl + ccache)
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ${{ github.workspace }}/.ccache
          key: znm2-612nss-${{ hashFiles('.github/workflows/build-znm2.yml') }}
          restore-keys: znm2-612nss-

      - name: Prepare config
        run: |
          set -e
          OW="${GITHUB_WORKSPACE}/openwrt"
          cat > "${OW}/.config" <<'ZNM2_SEED_EOF'
          # ZN-M2 / qualcommax-ipq60xx / LibWrt 25.12-nss / Linux 6.12.116
          # 满血 NSS 数据面 + squashfs-sysupgrade 构建种子
          # 由 workflow 复制为 LibWrt/.config 后执行 make defconfig 展开。
          # 增删包：改 CONFIG_PACKAGE_xxx=y 即可；不存在的包名会被 defconfig 静默忽略。
          #
          # 硬件基线（2026-11-14 只读核查）：zn,m2；128MiB ESMT SLC NAND；
          # mtd16 rootfs 0x6080000=96.5MiB；ubi0 93.4MiB，kernel 5.3 / rootfs 49.8 /
          # rootfs_data 35.4 MiB；cmdline 固定 ubi.mtd=rootfs rootfstype=squashfs。
          # 因此只能出 squashfs-sysupgrade，绝不能开 ext4 根。
          #
          # 源码核实（LiBwrt/LibWrt @ 25.12-nss）：
          #   - target/linux/generic/kernel-6.12 : LINUX_VERSION-6.12 = .116
          #   - target/linux/qualcommax/Makefile : KERNEL_PATCHVER:=6.12，
          #     DEFAULT_PACKAGES 直接列出全套 kmod-qca-nss-*
          #   - target/linux/qualcommax/ipq60xx/target.mk :
          #     DEFAULT_PACKAGES += ath11k-firmware-ipq6018 nss-firmware-ipq60xx kmod-qca-nss-crypto
          #   - feeds.conf.default 自带 nss_packages (laipeng668/nss-packages;NSS-LibWrt)
          #     与 sqm_scripts_nss，workflow 的 feeds install -a 会自动拉取
          #   - config/Config-build.in : CONFIG_USE_APK default y（上游默认 APK；本包显式关闭 → opkg）
          #   - image/ipq60xx.mk : define Device/zn_m2 用 FitImage + UbiFit，
          #     BLOCKSIZE 128k / PAGESIZE 2048，与本机 NAND 完全一致
          
          # ---- Target ---------------------------------------------------------------
          # LibWrt 的 scripts/target-metadata.pl 生成
          # CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2（与 6.18 分支同一套符号体系）。
          # 注意：只写 CONFIG_TARGET_DEVICE_*（旧 multi-profile 写法）会被 defconfig 丢弃，
          # 落到 ipq60xx.mk 第一个设备 8devices_mango-dvk。
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y
          CONFIG_TARGET_PROFILE="DEVICE_zn_m2"
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          
          # ---- Build ----------------------------------------------------------------
          CONFIG_CCACHE=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          # 包管理器：用户 2026-11-14 明确要求 opkg，不要 apk。
          # 上游 config/Config-build.in 第 71~74 行 USE_APK 是 default y，
          # 这里用 kconfig 标准的 "# CONFIG_USE_APK is not set" 显式关掉；
          # package/system/opkg/Makefile 的 DEFAULT:=y if !USE_APK 会把 opkg 带入，
          # 产物是 .ipk / Packages.gz；防线一会检查绝不能出现 CONFIG_USE_APK=y。
          # 代价（如实记录）：25.12 时代官方在线源已 apk 化（.apk + packages.adb，
          # 没有 Packages.gz），刷后 opkg update 需要另配提供 .ipk 索引的源；
          # 但本版把定制软件全部烤进固件，日常不依赖在线源。
          # CONFIG_USE_APK is not set
          
          # ---- LuCI（本包关闭 USE_APK，包管理器是 opkg）---------------------------
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-commands=y

          # ---- 用户定制清单（2026-11-14 openwrt.ai 定制页，逐项核实）----------------
          # 定制页「定制软件包」文本框逐字转录：
          #   luci-app-store luci-app-ddns-go luci-app-acme luci-app-cpufreq
          #   luci-app-samba4 luci-app-upnp kmod-usb-storage kmod-fs-ext4
          #   luci-app-ttyd luci-app-tailscale kmod-tun luci-app-irqbalance
          # 按本分支实际 feed 校正（immortalwrt/luci @ openwrt-25.12）：
          #   - luci-app-{acme,cpufreq,ddns-go,irqbalance,openclash,samba4,ttyd,upnp}
          #     全部存在于 applications/ 目录，可直接选中。
          #   - Tailscale 界面真名是 luci-app-tailscale-community；定制页写的
          #     luci-app-tailscale 在本 feed 不存在，会被 defconfig 静默丢弃。
          #   - luci-theme-argon 在 themes/ 目录（定制页勾选 Argon Light）。
          #   - luci-app-store 不在两个自带 feed，由 workflow 追加 istore feed。
          #   - kmod-usb-storage / kmod-fs-ext4 / luci-app-ttyd 已在上面 USB 段与
          #     LuCI 段选中；kmod-tun 在下面补。
          # 底层实现包由 luci-app-* 的 DEPENDS 自动带入；同时显式固化关键项，
          # 避免上游依赖调整导致「界面在、功能没编进去」。
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-ddns-go=y
          CONFIG_PACKAGE_ddns-go=y
          CONFIG_PACKAGE_luci-app-acme=y
          CONFIG_PACKAGE_acme-acmesh=y
          CONFIG_PACKAGE_luci-app-cpufreq=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_irqbalance=y
          # luci-app-ttyd 已在上面 LuCI 段选中，这里只补底层 ttyd
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-tun=y

          # ---- 网络/存储杂项 --------------------------------------------------------
          # UPnP 由上面 luci-app-upnp + miniupnpd 提供（nftables/Firewall4 版本，
          # 与定制页「不勾 iptables 替换 Firewall4」保持一致）。
          # IPv6 由 target 默认带入，无需额外开关。

          # ---- OpenClash（只装壳）--------------------------------------------------
          # 用户明确「openclash 先装个壳就行」：只把 LuCI 界面 + 管理脚本烤进固件，
          # mihomo 内核 / Country.mmdb / GeoSite.dat / 节点池一律不烤，
          # 刷机后从 U 盘备份恢复，既不让固件变大，也不依赖 GitHub 慢速下载。
          # 关键改动：immortalwrt/luci @ openwrt-25.12 自带 luci-app-openclash，
          # 因此不再追加 vernesong/OpenClash dev 第三方 feed —— 两个 feed 提供
          # 同名包会让 feeds install 冲突，且第三方 feed 在 25.12 下易编译失败。
          # 顺带把 TProxy 需要的两个内核模块烤进去（旧固件就是卡在这两个装不上）。
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          
          # ---- NSS 满血数据面（本路线核心，全部显式写死防止被裁剪）----------------
          # 这些包全部由 25.12-nss 分支的 DEFAULT_PACKAGES / nss_packages feed 提供，
          # 不是 6.18 分支那套 nss-wifi-drv；workflow 会逐个校验它们必须为 =y。
          CONFIG_PACKAGE_nss-firmware-ipq60xx=y
          CONFIG_PACKAGE_kmod-qca-nss-drv=y
          CONFIG_PACKAGE_kmod-qca-nss-ecm=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_kmod-qca-ssdk=y
          CONFIG_PACKAGE_kmod-qca-nss-crypto=y
          CONFIG_PACKAGE_kmod-nss-ifb=y
          # 其余 bridge-mgr / vlan-mgr / wifi-meshmgr / gre / pptp / l2tpv2 / qdisc /
          # map-t / vxlanmgr / tun6rd / tunipip6 / match / mirror / netlink / igs /
          # lag-mgr / eogremgr 由 qualcommax/Makefile 的 DEFAULT_PACKAGES 自动带入，
          # 不必逐条写（写了也只是重复）。
          #
          # 固件版本：nss_packages feed 的 choice 默认就是 11.4（11.4.0.5 Release 6），
          # 这里显式写死 11_4，与上游默认、与当前在用固件保持一致，也支持 802.11s mesh。
          # 源码依据：
          #   - firmware/nss-firmware/Makefile 第 76 行 default NSS_FIRMWARE_VERSION_11_4
          #   - qca-nss-drv/Makefile 在 CONFIG_NSS_FIRMWARE_VERSION_11_4=y 时，
          #     把驱动源码切到 QSDK 11.4.0.5 / 2021-09-13 / patches-11.4，
          #     与本机 kmod-qca-nss-drv 11.4.0.5.2021.09.13 完全一致。
          # workflow 会按 dispatch 输入 nss_firmware 覆盖这一行（默认 11_4）。
          # 需要 12.5 时手动选 12_5：会换用 QSDK 12.5 驱动源码并加编译宏，
          # 且 12.5 / 12.2 / 12.1 均不支持 802.11s mesh，属本机未验证过的新组合。
          CONFIG_NSS_FIRMWARE_VERSION_11_4=y
          
          # ---- 基础工具 -------------------------------------------------------------
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_ca-certificates=y
          
          # ---- WiFi 11ax（IPQ6018 / ath11k AHB，显式固化防止上游默认变动）----------
          # 上游 target/linux/qualcommax/Makefile 的 DEFAULT_PACKAGES 已自带
          # wpad-openssl + kmod-ath11k / -ahb / -pci；ipq60xx/target.mk 再补
          # ath11k-firmware-ipq6018；image/ipq60xx.mk 的 zn_m2 设备还有
          # DEVICE_PACKAGES := ipq-wifi-zn_m2（ZN-M2 板级校准 board-2.bin，缺了 WiFi 起不来）。
          # 这里全部写死，workflow 防线一会逐个校验 =y。
          # DTS：0906 补丁给 ipq6018.dtsi 加 wifi 节点；ipq6000-m2.dts 里
          # &wifi status = "okay" + qcom,ath11k-calibration-variant = "ZN-M2"。
          # 注：kmod-ath11k-pci 不写死——ZN M2 的 WiFi 走 AHB 总线，PCI 变体由
          # 上游默认包带入即可，不把它列入必选防线。
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_ath11k-firmware-ipq6018=y
          CONFIG_PACKAGE_ipq-wifi-zn_m2=y
          CONFIG_PACKAGE_wpad-openssl=y
          # 上游 wpad-openssl 的 DEPENDS 是条件依赖 libopenssl /
          # libopenssl-legacy；若这两个包没被选中，make defconfig 会把
          # wpad-openssl 一并清成 n —— run #2 就挂在「WiFi/USB3 关键包
          # wpad-openssl 未被选中」。这里显式补上依赖。
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libopenssl-legacy=y
          
          # ---- USB 3.0 + 存储（U 盘 / 后续安全 extroot 要用）------------------------
          # DTS：ipq6000-cmiot.dtsi 引用 ipq6018-common.dtsi，后者已把
          # &qusb_phy_0 / &qusb_phy_1 / &ssphy_0 / &usb2 / &usb3 全部 status = "okay"
          # （主线 ipq6018.dtsi 里这些节点默认 disabled，靠这段启用，已专门复核）。
          # config-6.12 里 CONFIG_PHY_QCOM_QMP_USB=y / CONFIG_PHY_QCOM_QUSB2=y 已内建。
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-dwc3=y
          CONFIG_PACKAGE_kmod-usb-dwc3-qcom=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          
          # ---- 不要加的东西 ---------------------------------------------------------
          # 1) 6.18 分支那套 nss-firmware / kmod-nss-wifi-drv 组合：本分支用的是
          #    nss_packages feed 的 nss-firmware + 经典 qca-nss-drv/ecm，两套不通用。
          # 2) 任何 ext4 / ubifs 根文件系统选项：本机 bootloader 只认 UBI squashfs。
          # 3) 大插件集合：固件越大，rootfs 卷越大，留给 rootfs_data(overlay) 越小。
          #    ubi0 总 93.4MiB，扣 kernel 后约 88MiB 是硬上限；建议固件尽量小。
          # 4) 不要禁用上面 NSS 段里的任何包，否则 PPPoE/NAT 卸载会退回 CPU。
          #
          # 刷机后会清空的既有成果（需事后重建）：PPPoE 账号/密码（本机另存，勿上传）、
          # LAN 网段、IPv6 PD、WAN 加固（dropbear/uhttpd 只绑 LAN）、
          # OpenClash + 免费 TOP30 节点、ACME 证书、ddns-go、自研 LuCI 模块、
          # U 盘挂载配置。包管理器保持 opkg（与当前 KWRT 一致），但软件源需重配。
          ZNM2_SEED_EOF
          # NSS 固件版本由 dispatch 输入决定，先清掉 seed 里的默认项再写
          sed -i '/^CONFIG_NSS_FIRMWARE_VERSION_/d' "${OW}/.config"
          echo "CONFIG_NSS_FIRMWARE_VERSION_${NSS_FW}=y" >> "${OW}/.config"
          echo "NSS 固件选择: CONFIG_NSS_FIRMWARE_VERSION_${NSS_FW}=y"
          # iStore 不在 LibWrt 自带 feed；按官方 README 追加 istore feed。
          # linkease/istore 会重定向到 istoreos/istore，git 能跟随重定向。
          # 用户定稿：不追加 linkease nas / nas_luci 两个 feed（不要路由狗界面）。
          if [ "${{ inputs.with_istore }}" = "true" ]; then
            echo '' >> "${OW}/feeds.conf.default"
            echo 'src-git istore https://github.com/linkease/istore;main' >> "${OW}/feeds.conf.default"
          else
            sed -i '/luci-app-store/d' "${OW}/.config"
          fi
          if [ "${{ inputs.with_openclash }}" != "true" ]; then
            sed -i '/luci-app-openclash/d' "${OW}/.config"
          fi
          cd "${OW}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "${{ inputs.with_istore }}" = "true" ]; then
            ./scripts/feeds install -d y -p istore luci-app-store
          fi
          make defconfig
          # 上游 DEFAULT_PACKAGES 含 wpad-openssl，但条件依赖未满足时
          # kconfig 会把整项清掉（run #2 实测）。兜底：至少留一个 wpad 变体。
          if ! grep -qE '^CONFIG_PACKAGE_wpad(-[a-z0-9-]+)?=y' .config; then
            echo "::warning:: 没有 wpad 变体被选中，回退到 wpad-basic-mbedtls"
            echo 'CONFIG_PACKAGE_wpad-basic-mbedtls=y' >> .config
            make defconfig
          fi
          echo "=== 实际选中的 wpad 变体 ==="
          grep -E '^CONFIG_PACKAGE_wpad[^=]*=y' .config || true
          # ------------------------------------------------------------------
          # busybox 1.37.0 / security_context_t deprecated + -Werror（run #4 / #5）
          # run #5 证明「只在 oldconfig 之前追加 # CONFIG_X is not set」无效：
          #   Makefile 行号 178→181 说明三行注入确实执行了，但 oldconfig 会重写
          #   $(PKG_BUILD_DIR)/.config，把后追加的关闭行冲掉；日志里
          #   LDLIBS="pam pam_misc pthread" 与 -Werror 依旧，三项仍是 y。
          # 三层修复，任何一层生效都不会再挂：
          #   1) 主 .config 源头关掉 CONFIG_BUSYBOX_{DEFAULT|CONFIG}_{WERROR,SELINUX,PAM}
          #      （LDLIBS / PKG_BUILD_DEPENDS 读的是主 .config，不是 busybox 内部 .config）
          #   2) busybox 的 Build/Configure 在 oldconfig 之后再 sed 一次（决定性）
          #   3) MAKE_FLAGS 的 EXTRA_CFLAGS 追加 -Wno-error=deprecated-declarations
          #      —— 即使前两层全失效，deprecated 也只是警告，不会变致命错误
          # 另：Build 开头做零成本静态自检（不触发编译），确认三层修复都在再开编。
          sed -i -E 's/^CONFIG_BUSYBOX_(DEFAULT|CONFIG)_(WERROR|SELINUX|PAM)=y$/# CONFIG_BUSYBOX_\1_\2 is not set/' .config
          echo "=== 主 .config 里的 busybox 关键项（应全部 is not set）==="
          grep -E '^# CONFIG_BUSYBOX_(DEFAULT|CONFIG)_(WERROR|SELINUX|PAM) is not set|^CONFIG_BUSYBOX_(DEFAULT|CONFIG)_(WERROR|SELINUX|PAM)=' .config || true
          if grep -qE '^CONFIG_BUSYBOX_(DEFAULT|CONFIG)_(WERROR|SELINUX|PAM)=y' .config; then
            echo "::error:: busybox WERROR/SELINUX/PAM 仍为 y，拒绝继续"; exit 1
          fi
          python3 - "${OW}/package/utils/busybox/Makefile" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()

          # 3) 编译标志兜底：deprecated 警告不升级为错误
          cflag_old = '\tEXTRA_CFLAGS="$(TARGET_CFLAGS) $(TARGET_CPPFLAGS)" \\\n'
          cflag_new = '\tEXTRA_CFLAGS="$(TARGET_CFLAGS) $(TARGET_CPPFLAGS) -Wno-error=deprecated-declarations" \\\n'
          assert cflag_old in s, '::error:: busybox EXTRA_CFLAGS 结构变化，拒绝盲目编译'
          s = s.replace(cflag_old, cflag_new, 1)

          # 2) oldconfig 前后各强制一次。
          #    run #7 实测：recipe 里写 '$$' 不够 —— define + $(eval) 会让 make
          #    **展开两次**：第一次 $$ -> $，第二次 $/ 被当成「名为 / 的变量」吃掉，
          #    最终 shell 收到 's/^CONFIG_WERROR=y# CONFIG_WERROR is not set/'
          #    （sed: unterminated `s' command）。所以彻底不用 $ 行尾锚点，
          #    改用 '.*' 吞掉行尾；整条命令不含任何裸 $，双重展开也伤不到。
          sedfix = ("\tsed -i -e 's/^CONFIG_WERROR=y.*/# CONFIG_WERROR is not set/' "
                    "-e 's/^CONFIG_SELINUX=y.*/# CONFIG_SELINUX is not set/' "
                    "-e 's/^CONFIG_PAM=y.*/# CONFIG_PAM is not set/' $(PKG_BUILD_DIR)/.config")
          oldcfg = "\tyes 'n' | $(MAKE) -C $(PKG_BUILD_DIR) $(MAKE_FLAGS) oldconfig"
          assert oldcfg in s, '::error:: busybox oldconfig 结构变化，拒绝盲目编译'
          if sedfix not in s:
              s = s.replace(oldcfg, sedfix + "\n" + oldcfg + "\n" + sedfix, 1)
          assert s.count(sedfix) == 2, '::error:: busybox 双段 sed 未写入'
          assert '$$' not in sedfix, '::error:: sedfix 含 $$ 锚点，make 双重展开会吃掉'
          assert '=y$$/' not in s, '::error:: busybox Makefile 残留 v8 的 $$ 锚点'
          assert '-Wno-error=deprecated-declarations' in s, '::error:: 编译标志兜底未写入'
          open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('busybox: 三层修复已写入（主配置 + 双段 sed + -Wno-error）')
          PY
          echo "=== 注入后 Makefile 的关键行 ==="
          grep -nE 'EXTRA_CFLAGS=|Wno-error|CONFIG_WERROR|CONFIG_SELINUX|CONFIG_PAM|oldconfig' "${OW}/package/utils/busybox/Makefile" | head -20

      # 防线一：确认设备 / 文件系统 / NSS 关键包，不对就停工。
      # LibWrt 的 target-metadata.pl 生成 CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2，
      # 与 6.18 分支同一套符号体系；仍同时接受 multi-profile 写法以防分支变化。
      - name: Verify target profile and NSS
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}/openwrt"
          echo "--- .config 中的 target 段 ---"
          grep -E '^CONFIG_TARGET_(qualcommax|PROFILE|DEVICE|ROOTFS)' .config || true
          grep -qE '^CONFIG_TARGET_(qualcommax_ipq60xx_DEVICE_zn_m2|DEVICE_qualcommax_ipq60xx_DEVICE_zn_m2)=y' .config || {
            echo "::error:: zn_m2 设备未被选中，拒绝继续"; exit 1; }
          if grep -q '^CONFIG_TARGET_PROFILE=' .config; then
            grep -q '^CONFIG_TARGET_PROFILE="DEVICE_zn_m2"' .config || {
              echo "::error:: CONFIG_TARGET_PROFILE 不是 DEVICE_zn_m2，会编成别的设备"; exit 1; }
          fi
          grep -q '^CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config || {
            echo "::error:: 未启用 squashfs，本机 NAND/UBI 刷不了"; exit 1; }
          echo "--- 包管理器（用户要求 opkg，禁止 APK）---"
          grep -E '^# CONFIG_USE_APK is not set|^CONFIG_USE_APK' .config || true
          if grep -q '^CONFIG_USE_APK=y' .config; then
            echo "::error:: CONFIG_USE_APK=y，会编成 APK 固件；用户明确要求 opkg，拒绝继续"; exit 1
          fi
          grep -q '^CONFIG_PACKAGE_opkg=y' .config || echo "::warning:: 未显式看到 CONFIG_PACKAGE_opkg=y（应由 !USE_APK 默认带入）"
          echo "--- NSS 关键包（必须 =y）---"
          grep -E '^CONFIG_PACKAGE_(kmod-qca-nss-drv|kmod-qca-nss-ecm|kmod-qca-nss-drv-pppoe|nss-firmware-ipq60xx)=' .config || true
          for p in kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-nss-drv-pppoe nss-firmware-ipq60xx; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || {
              echo "::error:: NSS 关键包 ${p} 未被选中，会退化成纯 CPU 转发，拒绝继续"; exit 1; }
          done
          grep -q "^CONFIG_NSS_FIRMWARE_VERSION_${NSS_FW}=y" .config || {
            echo "::error:: NSS 固件版本未选中或与 dispatch 输入 ${NSS_FW} 不一致（默认应为 11_4）"; exit 1; }
          echo "--- WiFi / USB3 关键包（必须 =y）---"
          grep -E '^CONFIG_PACKAGE_(kmod-ath11k|kmod-ath11k-ahb|ath11k-firmware-ipq6018|ipq-wifi-zn_m2|kmod-usb3|kmod-usb-dwc3|kmod-usb-dwc3-qcom|kmod-usb-storage|kmod-usb-storage-uas)=' .config || true
          MISSING=""
          for p in kmod-ath11k kmod-ath11k-ahb ath11k-firmware-ipq6018 ipq-wifi-zn_m2 \
                   kmod-usb3 kmod-usb-dwc3 kmod-usb-dwc3-qcom kmod-usb-storage kmod-usb-storage-uas; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  缺失: $p"
              MISSING="$MISSING $p"
            fi
          done
          echo "--- wpad（WiFi 认证守护进程，任一变体 =y 即可）---"
          grep -E '^CONFIG_PACKAGE_wpad[^=]*=' .config || true
          grep -qE '^CONFIG_PACKAGE_wpad(-[a-z0-9-]+)?=y' .config || {
            echo "::error:: 没有任何 wpad 变体被选中，WiFi 起不来，拒绝继续"; exit 1; }
          if [ -n "$MISSING" ]; then
            echo "::error:: 以下 WiFi/USB3 关键包未被选中:$MISSING（要求带 WiFi + USB3 支持），拒绝继续"
            exit 1
          fi
          echo "--- 实际选中的 NSS 固件版本 ---"
          grep -E '^CONFIG_NSS_FIRMWARE_VERSION_' .config || true
          if grep -q '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_8devices_mango-dvk=y' .config; then
            echo "::warning:: mango-dvk 也被选中；发布环节只取 zn_m2 文件"
          fi

      # 无论防线一成功与否，都把展开后的 .config 留档，便于下次一次看全缺失项。
      - name: Upload defconfig for diagnosis
        if: ${{ always() && hashFiles('openwrt/.config') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: znm2-defconfig-run${{ github.run_number }}
          path: ${{ github.workspace }}/openwrt/.config
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      # CPU 1.8GHz 解锁（编译期，唯一可行路径）：
      # 主线 ipq6018.dtsi 把 1608/1800 两档写成 opp-supported-hw = <0x1>，
      # 只有 eFuse speedbin=0 的芯片能用；本机 speedbin 非 0，qcom-cpufreq-nvmem
      # 会过滤掉这两档。运行时 echo 1800000 被内核静默拒绝，configfs/DT-overlay
      # 又没编进内核（KWRT 上实测），所以只能在编译期把位图放宽到 <0xf>。
      - name: Unlock CPU 1.6/1.8GHz OPP
        if: ${{ inputs.cpu_unlock_18 }}
        run: |
          set -eo pipefail
          OW="${GITHUB_WORKSPACE}/openwrt"
          cd "${OW}"
          echo "=== 展开内核源码并应用 target patches ==="
          make target/linux/prepare V=s 2>&1 | tail -25
          DTS=$(find build_dir -path '*/arch/arm64/boot/dts/qcom/ipq6018.dtsi' -type f 2>/dev/null | head -n1)
          [ -n "$DTS" ] || { echo "::error:: 找不到 ipq6018.dtsi，拒绝产出未解锁固件"; exit 1; }
          echo "DTS = $DTS"
          python3 - "$DTS" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          total = 0
          for hz in ('1608000000', '1800000000'):
              pat = re.compile(r'(opp-' + hz + r'\s*\{[^}]*?opp-supported-hw\s*=\s*<0x)([0-9a-fA-F]+)(>)', re.S)
              s, n = pat.subn(r'\g<1>f\g<3>', s)
              print('  opp-%s: 位图放宽 %d 处' % (hz, n))
              total += n
          if total != 2:
              sys.exit('::error:: 期望处理 2 个高频 OPP 档，实际 %d 个；拒绝产出未解锁固件' % total)
          open(p, 'w', encoding='utf-8').write(s)
          print('已写入', p)
          PY
          echo "=== 复核 1.6G / 1.8G 档 ==="
          grep -A5 -E 'opp-1608000000|opp-1800000000' "$DTS" | grep -E 'opp-|supported-hw|microvolt' || true
          grep -q 'opp-supported-hw = <0xf>' "$DTS" || { echo "::error:: 位图放宽未生效"; exit 1; }
          # 删掉可能已生成的 dtb，强制 kbuild 用新 dtsi 重编设备树
          find build_dir -path '*/arch/arm64/boot/dts/qcom/*.dtb' -delete 2>/dev/null || true

      # 首次开机预置（写进编译产物的 files/，不碰任何在用设备）：
      # LAN 192.168.9.1 来自定制页；CPU 定频脚本仅在 1.8GHz 频点存在时才动作。
      - name: Preset first-boot defaults
        run: |
          set -e
          OW="${GITHUB_WORKSPACE}/openwrt"
          mkdir -p "${OW}/files/etc/uci-defaults" "${OW}/files/etc/init.d" "${OW}/files/etc/rc.d"
          if [ "${{ inputs.preset_lan }}" = "true" ]; then
            cat > "${OW}/files/etc/uci-defaults/99-default-lan" <<'LAN_EOF'
          #!/bin/sh
          # 定制页指定后台地址 192.168.9.1；避开同网段的光猫管理地址，
          # 也与刷机前备份里的 OpenClash / ddns-go / ACME 配置保持同一网段。
          uci -q set network.lan.ipaddr='192.168.9.1'
          uci -q commit network
          exit 0
          LAN_EOF
            chmod 755 "${OW}/files/etc/uci-defaults/99-default-lan"
          fi
          if [ "${{ inputs.cpu_unlock_18 }}" = "true" ] && [ "${{ inputs.cpu_lock_perf }}" = "true" ]; then
            cat > "${OW}/files/etc/init.d/cpu1800" <<'CPU_EOF'
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              P=/sys/devices/system/cpu/cpufreq/policy0
              [ -r "$P/scaling_available_frequencies" ] || return 0
              grep -qw 1800000 "$P/scaling_available_frequencies" || return 0
              echo performance > "$P/scaling_governor"
              echo 1800000 > "$P/scaling_min_freq"
              echo 1800000 > "$P/scaling_max_freq"
          }
          CPU_EOF
            chmod 755 "${OW}/files/etc/init.d/cpu1800"
            ln -sf ../init.d/cpu1800 "${OW}/files/etc/rc.d/S99cpu1800"
          fi
          echo "=== 注入的 files/ ==="
          find "${OW}/files" -maxdepth 4 \( -type f -o -type l \) -print | sed "s#${OW}/##"

      - name: Build
        run: |
          cd "${GITHUB_WORKSPACE}/openwrt"
          set -o pipefail
          # run #6 教训：绝不能单独跑 `make package/utils/busybox/compile`。
          # 单包目标不走 toolchain/install，staging_dir/toolchain-*/lib/ 下还没有
          # libgcc_s.so.*，会先挂在 package/libs/toolchain（cp: cannot stat ...）。
          # 完整 `make world` 才会按依赖链把工具链装好；run #4/#5 已证明能走到 busybox。
          # 这里只做零成本静态自检，确认三层修复都在，避免再空跑 2 小时。
          echo "=== busybox 三层修复静态自检（不触发编译）==="
          BAD=0
          if grep -qE '^CONFIG_BUSYBOX_(DEFAULT|CONFIG)_(WERROR|SELINUX|PAM)=y' .config; then
            echo "::error:: 主 .config 仍有 busybox WERROR/SELINUX/PAM = y"; BAD=1
          fi
          BBMK=package/utils/busybox/Makefile
          grep -Fq 's/^CONFIG_WERROR=y.*/' "$BBMK" || { echo "::error:: busybox Makefile 缺少 v9 无锚点 sed"; BAD=1; }
          [ "$(grep -Fc 's/^CONFIG_WERROR=y.*/' "$BBMK")" -eq 2 ] || { echo "::error:: busybox 双段 sed 数量不对"; BAD=1; }
          if grep -Fq '=y$$/' "$BBMK"; then echo '::error:: 残留 v8 的 $$ 锚点，make 双重展开会吃掉'; BAD=1; fi
          grep -Fq -- '-Wno-error=deprecated-declarations' "$BBMK" || { echo "::error:: busybox Makefile 缺少 -Wno-error 兜底"; BAD=1; }
          if [ "$BAD" -ne 0 ]; then
            echo "::error:: busybox 修复自检未通过，终止（避免空跑 2 小时）"; exit 1
          fi
          echo "  ① 主 .config 三项已关  ② oldconfig 后双段 sed 就位  ③ -Wno-error 兜底就位"
          # 保留原来的「并行失败后 -j1 V=s 重跑」逻辑，同时把两份输出留档：
          # 失败时只上传末尾若干行，避免以后还要手动复制几万行日志。
          if ! make -j"$(nproc)" 2>&1 | tee build-parallel.log; then
            echo "=== 并行编译失败，改用 -j1 V=s 重跑 ==="
            if ! make -j1 V=s 2>&1 | tee build-serial.log; then
              echo "=== 串行编译末尾 120 行 ==="
              tail -n 120 build-serial.log
              exit 1
            fi
          fi

      - name: Save build failure tail
        if: failure()
        run: |
          cd "${GITHUB_WORKSPACE}/openwrt"
          {
            echo "===== make -j (末尾 100 行) ====="
            tail -n 100 build-parallel.log 2>/dev/null || true
            echo "===== make -j1 V=s (末尾 400 行) ====="
            tail -n 400 build-serial.log 2>/dev/null || true
          } > "${GITHUB_WORKSPACE}/build-tail.log"

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: znm2-build-tail-run${{ github.run_number }}
          path: ${{ github.workspace }}/build-tail.log
          if-no-files-found: warn
          retention-days: 7

      # 防线二：必须有 zn_m2 的 squashfs-sysupgrade，且 root 卷不超过
      # UBI 硬上限（ubi0 93.4MiB 扣 kernel ~5.3MiB ≈ 88MiB），否则拒绝发布。
      - name: Verify firmware (device / fs / size)
        id: verify
        run: |
          set -e
          BIN="${GITHUB_WORKSPACE}/openwrt/bin/targets/qualcommax/ipq60xx"
          echo "--- 产物列表 ---"
          ls -lh "$BIN"
          SYS=$(ls "$BIN"/*zn_m2*squashfs-sysupgrade.bin 2>/dev/null | head -n1 || true)
          if [ -z "$SYS" ]; then
            echo "::error:: 没找到 *zn_m2*squashfs-sysupgrade.bin，拒绝发布（很可能编成了别的设备）"
            exit 1
          fi
          SIZE=$(stat -c%s "$SYS")
          echo "file=$(basename "$SYS")" >> "$GITHUB_OUTPUT"
          echo "固件: $(basename "$SYS")  ${SIZE} bytes = $((SIZE/1048576)) MiB"
          if [ "$SIZE" -gt 92274688 ]; then
            echo "::error:: 固件超过 88 MiB UBI 硬上限"; exit 1
          fi
          ROOTMEMBER=$(tar tf "$SYS" 2>/dev/null | grep -m1 '/root$' || true)
          ROOTLEN=0
          if [ -n "$ROOTMEMBER" ]; then
            ROOTLEN=$(tar xOf "$SYS" "$ROOTMEMBER" 2>/dev/null | wc -c)
            echo "root 成员: ${ROOTLEN} bytes = $((ROOTLEN/1048576)) MiB"
            if [ "$ROOTLEN" -gt 92274688 ]; then
              echo "::error:: root 卷超过 88 MiB，刷写时 ubimkvol 会失败并变砖"; exit 1
            fi
            MAGIC=$(tar xOf "$SYS" "$ROOTMEMBER" 2>/dev/null | dd bs=4 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
            echo "root magic: $MAGIC (期望 68737173 = squashfs)"
            if [ -z "$MAGIC" ] || [ "$MAGIC" != "68737173" ]; then
              echo "::error:: root 不是 squashfs（或无法识别），本机 NAND/UBI 只认 squashfs-sysupgrade，拒绝发布"
              exit 1
            fi
          else
            echo "::warning:: 未能解析 tar 内的 root 成员，请在本地用 verify_firmware.py 复核"
          fi
          echo "=== 内置软件复核（.manifest，缺失仅告警不阻断） ==="
          MAN=$(ls "$BIN"/*.manifest 2>/dev/null | head -n1 || true)
          if [ -n "$MAN" ]; then
            for p in luci-app-openclash luci-app-store luci-app-upnp luci-app-samba4 \
                     luci-app-ddns-go luci-app-acme luci-app-cpufreq \
                     luci-app-tailscale-community luci-app-irqbalance luci-app-ttyd \
                     luci-theme-argon kmod-tun kmod-usb3 kmod-ath11k; do
              if grep -q "^${p} " "$MAN"; then
                echo "  OK   $p"
              else
                echo "  ::warning:: 未内置 $p"
              fi
            done
          else
            echo "::warning:: 没找到 .manifest，跳过内置软件复核"
          fi
          cd "${GITHUB_WORKSPACE}"
          sha256sum "$SYS" | tee sha256.txt
          COMMIT=$(cat source-commit.txt | cut -c1-9)
          KLINE=$(grep -R '^LINUX_VERSION-6.12' openwrt/target/linux/generic/kernel-6.12 | head -n1 || true)
          {
            echo "ZN-M2 固件构建报告"
            echo "源码  : LiBwrt/LibWrt @ ${SOURCE_REF} / ${COMMIT}"
            echo "内核  : ${KLINE:-Linux 6.12.x}"
            echo "NSS   : 固件 ${NSS_FW}（11_4 时驱动源码为 QSDK 11.4.0.5 / patches-11.4，与当前在用一致）"
            echo "NSS包 : kmod-qca-nss-drv / ecm / drv-pppoe / dp / ssdk 全套"
            echo "包管理: opkg / .ipk（# CONFIG_USE_APK is not set；产物 .ipk + Packages.gz；命令 opkg update/install/remove）"
            echo "WiFi  : ath11k(AHB) + ath11k-firmware-ipq6018 + ipq-wifi-zn_m2 板级校准 + wpad-openssl；DTS &wifi okay"
            echo "USB3  : kmod-usb3/dwc3/dwc3-qcom + storage/uas；DTS &usb3 / &ssphy_0 / &qusb_phy_0 okay"
            echo "内置包: iStore / OpenClash(仅壳) / ddns-go / acme / cpufreq / samba4 / upnp / tailscale / ttyd / irqbalance / Argon Light"
            echo "不含  : 路由狗 NAS 界面（用户定稿取消；底层 samba4 + USB 存储 + 文件系统仍在）"
            echo "OC壳  : 只含 LuCI+脚本；mihomo 内核 / GeoIP / 节点池刷后从备份恢复，未烤入固件"
            if [ "${{ inputs.cpu_unlock_18 }}" = "true" ]; then
              echo "CPU   : 1.6/1.8GHz OPP 位图 <0x1>→<0xf>（speedbin 解锁，最高 1.8GHz）"
            else
              echo "CPU   : 上游默认（最高 1.512GHz）"
            fi
            if [ "${{ inputs.cpu_lock_perf }}" = "true" ] && [ "${{ inputs.cpu_unlock_18 }}" = "true" ]; then
              echo "定频  : 开机 performance + 1800000（/etc/init.d/cpu1800，可 disable）"
            fi
            if [ "${{ inputs.preset_lan }}" = "true" ]; then
              echo "LAN   : 首次开机预置 192.168.9.1（uci-defaults）"
            fi
            echo "设备  : qualcommax / ipq60xx / zn_m2 (NAND + UBI)"
            echo "文件  : $(basename "$SYS")"
            echo "大小  : ${SIZE} bytes ($((SIZE/1048576)) MiB)"
            echo "root  : ${ROOTLEN} bytes；magic ${MAGIC:-未解析}"
            echo "SHA256: $(cut -d' ' -f1 sha256.txt)"
            echo "时间  : $(date -u '+%Y-%m-%d %H:%M UTC')"
          } | tee BUILD-REPORT.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: znm2-612nss-run${{ github.run_number }}
          path: |
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2*
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/config.buildinfo
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/feeds.buildinfo
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/version.buildinfo
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/profiles.json
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/sha256sums
            ${{ github.workspace }}/BUILD-REPORT.txt
            ${{ github.workspace }}/sha256.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: znm2-612nss-latest
          name: ZN-M2 6.12.116 NSS run${{ github.run_number }}
          overwrite: true
          body_path: ${{ github.workspace }}/BUILD-REPORT.txt
          files: |
            ${{ github.workspace }}/openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2*
            ${{ github.workspace }}/BUILD-REPORT.txt
            ${{ github.workspace }}/sha256.txt
